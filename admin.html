<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | GentsAcademy</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <div class="logo-placeholder">GA</div>
                <span class="brand-text">Admin</span>
            </div>
            <nav class="admin-nav">
                <a href="#" class="admin-nav-item active">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="admin-nav-item">
                    <i class="fas fa-book"></i>
                    <span>Courses</span>
                </a>
                <a href="#" class="admin-nav-item">
                    <i class="fas fa-users"></i>
                    <span>Students</span>
                </a>
                <a href="#" class="admin-nav-item">
                    <i class="fas fa-certificate"></i>
                    <span>Certificates</span>
                </a>
                <a href="#" class="admin-nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            <div class="admin-user-profile">
                <div class="author-avatar">AD</div>
                <div class="admin-user-info">
                    <p class="author-name">Admin User</p>
                    <p class="author-role">Super Admin</p>
                </div>
                <a href="index.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-search">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search data...">
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> Add Course</button>
                    <div class="notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notif-badge">3</span>
                    </div>
                </div>
            </header>

            <div class="admin-content-inner">
                <h1 class="display-font mb-lg">Admin <span class="gradient-text">Dashboard</span></h1>
                
                <!-- Stats Grid -->
                <div class="admin-stats-grid">
                    <div class="admin-stat-card">
                        <div class="stat-icon bg-lib-blue"><i class="fas fa-users"></i></div>
                        <div class="stat-details">
                            <p class="stat-label">Total Students</p>
                            <h3 class="stat-value">15,420</h3>
                            <p class="stat-trend positive"><i class="fas fa-arrow-up"></i> 12% this month</p>
                        </div>
                    </div>
                    <div class="admin-stat-card">
                        <div class="stat-icon bg-lib-gold"><i class="fas fa-book"></i></div>
                        <div class="stat-details">
                            <p class="stat-label">Active Courses</p>
                            <h3 class="stat-value">28</h3>
                            <p class="stat-trend positive"><i class="fas fa-arrow-up"></i> 2 new added</p>
                        </div>
                    </div>
                    <div class="admin-stat-card">
                        <div class="stat-icon bg-lib-red"><i class="fas fa-certificate"></i></div>
                        <div class="stat-details">
                            <p class="stat-label">Certs Issued</p>
                            <h3 class="stat-value">1,245</h3>
                            <p class="stat-trend positive"><i class="fas fa-arrow-up"></i> 8% increase</p>
                        </div>
                    </div>
                </div>

                <!-- Recent Courses Table -->
                <div class="admin-section-card mt-lg">
                    <div class="card-header">
                        <h3 class="display-font">Manage Courses</h3>
                        <div class="table-actions">
                            <button class="btn-icon"><i class="fas fa-filter"></i></button>
                            <button class="btn-icon"><i class="fas fa-download"></i></button>
                        </div>
                    </div>
                    <div class="admin-table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Course Title</th>
                                    <th>Category</th>
                                    <th>Students</th>
                                    <th>Rating</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-courses-table">
                                <!-- Data injected by admin.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
