<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | GentsAcademy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #f8f9fa;">
    <div class="admin-layout" style="display: flex; min-height: 100vh;">
        <!-- Sidebar -->
        <aside style="width: 250px; background: var(--lib-blue); color: white; padding: 2rem;">
            <div class="nav-logo" style="color: white; margin-bottom: 3rem; font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800;">GentsAdmin</div>
            <nav>
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 1rem; padding: 0;">
                    <li><a href="#" class="active" style="display: block; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; color: white;"><i class="fas fa-book" style="margin-right: 10px;"></i> Courses</a></li>
                    <li><a href="#" style="display: block; padding: 10px; color: rgba(255,255,255,0.7);"><i class="fas fa-users" style="margin-right: 10px;"></i> Users</a></li>
                    <li><a href="#" style="display: block; padding: 10px; color: rgba(255,255,255,0.7);"><i class="fas fa-chart-line" style="margin-right: 10px;"></i> Reports</a></li>
                    <li><a href="index.html" style="display: block; padding: 10px; margin-top: 5rem; color: rgba(255,255,255,0.7);"><i class="fas fa-sign-out-alt" style="margin-right: 10px;"></i> Exit</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main style="flex: 1; padding: 3rem;">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <h1 class="display-font" style="margin: 0;">Course Management</h1>
                <button class="btn btn-primary"><i class="fas fa-plus"></i> Add New Course</button>
            </header>

            <div class="stats-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-bottom: 3rem;">
                <div class="card" style="padding: 1.5rem; border-left: 5px solid var(--lib-blue); background: white;">
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Total Students</p>
                    <h2 style="margin: 10px 0 0 0; font-family: 'Syne', sans-serif;">15,402</h2>
                </div>
                <div class="card" style="padding: 1.5rem; border-left: 5px solid var(--lib-red); background: white;">
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Active Courses</p>
                    <h2 style="margin: 10px 0 0 0; font-family: 'Syne', sans-serif;">24</h2>
                </div>
                <div class="card" style="padding: 1.5rem; border-left: 5px solid var(--lib-gold); background: white;">
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Certificates Issued</p>
                    <h2 style="margin: 10px 0 0 0; font-family: 'Syne', sans-serif;">1,280</h2>
                </div>
            </div>

            <div class="card" style="padding: 0; overflow: hidden; background: white; border-radius: 12px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="background: #f1f1f1;">
                        <tr>
                            <th style="padding: 1.2rem;">Course Title</th>
                            <th style="padding: 1.2rem;">Category</th>
                            <th style="padding: 1.2rem;">Students</th>
                            <th style="padding: 1.2rem;">Rating</th>
                            <th style="padding: 1.2rem;">Status</th>
                            <th style="padding: 1.2rem;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-courses-table">
                        <!-- Course rows will be injected -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
