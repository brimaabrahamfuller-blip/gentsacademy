<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register | GentsAcademy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="height: 100vh; overflow: hidden; background: white;">
    <div class="auth-container" style="display: flex; height: 100%;">
        <!-- Left Side: Brand Panel -->
        <div class="auth-panel" style="flex: 1; background: var(--bg-dark); color: white; display: flex; flex-direction: column; justify-content: center; padding: 10%; position: relative;">
            <div style="position: relative; z-index: 2;">
                <a href="index.html" class="nav-logo" style="color: white; font-size: 2rem;">GentsAcademy</a>
                <h1 class="display-font" style="font-size: 3.5rem; margin: 2rem 0; line-height: 1; color: white;">Unlock Your <span class="text-lib-gold">Potential.</span></h1>
                <p style="font-size: 1.2rem; opacity: 0.8; color: white;">Join thousands of Liberian students learning the skills of tomorrow.</p>
            </div>
            <!-- Pattern Placeholder -->
            <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; background: linear-gradient(to top, rgba(191,10,48,0.1), transparent);"></div>
        </div>

        <!-- Right Side: Form Panel -->
        <div class="form-panel" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 5%;">
            <div class="form-box" style="width: 100%; max-width: 400px;">
                <div class="form-tabs" style="display: flex; gap: 2rem; margin-bottom: 2rem;">
                    <button class="tab-btn active" id="login-tab" style="background: none; border: none; font-size: 1.5rem; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; color: var(--lib-blue); border-bottom: 3px solid var(--lib-blue);">Login</button>
                    <button class="tab-btn" id="register-tab" style="background: none; border: none; font-size: 1.5rem; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; color: #ccc;">Register</button>
                </div>

                <form id="auth-form" class="animate-fade-up">
                    <div id="name-field" style="display: none; margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Full Name</label>
                        <input type="text" id="full-name" placeholder="Enter your name" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius-sm);">
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email Address</label>
                        <input type="email" id="email" placeholder="student@example.com" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius-sm);">
                    </div>
                    <div style="margin-bottom: 2rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: var(--radius-sm);">
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-primary btn-large" style="width: 100%;">Sign In</button>
                </form>
                
                <p id="auth-feedback" style="margin-top: 1rem; text-align: center; font-size: 0.9rem; color: var(--lib-red);"></p>
            </div>
        </div>
    </div>

    <style>
        @media (max-width: 768px) {
            .auth-panel { display: none !important; }
        }
    </style>

    <script src="js/auth.js"></script>
</body>
</html>
