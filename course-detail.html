<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details | GentsAcademy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">GentsAcademy</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="auth.html">Login</a></li>
        </ul>
        <a href="auth.html" class="btn btn-primary">Join Free</a>
    </nav>

    <main id="course-detail-content" style="margin-top: 60px;">
        <!-- Content will be loaded by course-detail.js -->
        <div style="text-align: center; padding: 5rem;">Loading course details...</div>
    </main>

    <style>
        .detail-hero {
            background: var(--bg-dark);
            color: white;
            padding: var(--spacing-xl) 5%;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: var(--spacing-lg);
            align-items: center;
        }
        .curriculum-section {
            padding: var(--spacing-lg) 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .accordion-item {
            border: 1px solid #eee;
            margin-bottom: var(--spacing-sm);
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: white;
        }
        .accordion-header {
            padding: var(--spacing-sm) var(--spacing-md);
            background: #f9f9f9;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            transition: var(--transition);
        }
        .accordion-header:hover {
            background: #f0f0f0;
        }
        .accordion-content {
            padding: var(--spacing-md);
            display: none;
            border-top: 1px solid #eee;
            background: white;
        }
        .accordion-item.active .accordion-content {
            display: block;
        }
        .accordion-item.active .accordion-header {
            background: var(--lib-blue);
            color: white;
        }
        .course-thumb-large {
            width: 100%;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
        }
        @media (max-width: 768px) {
            .detail-hero { grid-template-columns: 1fr; padding: var(--spacing-lg) 5%; }
            .hero-actions { display: flex; flex-direction: column; gap: 1rem; }
        }
    </style>

    <script src="js/course-detail.js"></script>
</body>
</html>
