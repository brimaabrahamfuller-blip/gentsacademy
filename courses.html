<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | GentsAcademy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">GentsAcademy</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="courses.html" class="active">Courses</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="auth.html">Login</a></li>
        </ul>
        <a href="auth.html" class="btn btn-primary">Join Free</a>
    </nav>

    <header class="page-header bg-lib-blue" style="padding: var(--spacing-xl) 5%; color: white; text-align: center; margin-top: 60px;">
        <h1 class="display-font animate-fade-up">Our <span class="text-lib-gold">Courses</span></h1>
        <p>Master the skills you need for Liberia's future economy.</p>
    </header>

    <section class="filters-section" style="padding: var(--spacing-md) 5%; background: white; box-shadow: var(--shadow-sm); position: sticky; top: 60px; z-index: 100;">
        <div class="container" style="display: flex; gap: var(--spacing-md); flex-wrap: wrap; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto;">
            <div class="search-box" style="flex: 1; min-width: 300px; position: relative;">
                <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                <input type="text" id="course-search" placeholder="Search for courses..." style="width: 100%; padding: 12px 12px 12px 45px; border: 1px solid #ddd; border-radius: var(--radius-sm); font-size: 1rem;">
            </div>
            <div class="filter-tabs" id="category-filters" style="display: flex; gap: var(--spacing-sm); overflow-x: auto; padding-bottom: 5px;">
                <button class="btn btn-filter active" data-category="all">All</button>
                <button class="btn btn-filter" data-category="Business">Business</button>
                <button class="btn btn-filter" data-category="Technology">Tech</button>
                <button class="btn btn-filter" data-category="AI">AI</button>
            </div>
        </div>
    </section>

    <main class="container" style="padding: var(--spacing-lg) 5%; max-width: 1200px; margin: 0 auto;">
        <div class="courses-grid" id="courses-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--spacing-md);">
            <!-- All courses will be injected here -->
        </div>
    </main>

    <style>
        .btn-filter {
            background: #eee;
            color: var(--text-main);
            white-space: nowrap;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
        }
        .btn-filter.active {
            background: var(--lib-blue);
            color: white;
        }
    </style>

    <script src="js/courses.js"></script>
</body>
</html>
