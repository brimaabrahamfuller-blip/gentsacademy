<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GentsAcademy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #f4f7f6;">
    <nav class="navbar">
        <div class="nav-logo">GentsAcademy</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
        </ul>
        <div id="user-profile" style="display: flex; align-items: center; gap: 10px;">
            <button id="logout-btn" class="btn btn-sm" style="background: transparent; border: 1px solid var(--lib-red); color: var(--lib-red); padding: 5px 12px; font-size: 0.8rem;">Logout</button>
            <div class="avatar" style="width: 35px; height: 35px; background: var(--lib-blue); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700;">U</div>
        </div>
    </nav>

    <main class="container" style="margin-top: 100px; padding: 0 5%; max-width: 1200px; margin-left: auto; margin-right: auto;">
        <header class="dashboard-header" style="margin-bottom: var(--spacing-lg);">
            <h1 class="display-font">Welcome Back, <span id="welcome-name" class="text-lib-blue">Student</span>!</h1>
            <p>You have <span id="course-count">0</span> courses in progress.</p>
        </header>

        <div class="dashboard-grid" style="display: grid; grid-template-columns: 2fr 1fr; gap: var(--spacing-lg);">
            <section class="enrolled-courses">
                <h2 class="display-font" style="margin-bottom: var(--spacing-md);">My <span class="text-lib-red">Courses</span></h2>
                <div id="enrolled-container" style="display: grid; gap: var(--spacing-md);">
                    <!-- Enrolled course cards -->
                    <div class="card" style="padding: 2rem; text-align: center;">
                        <p>You haven't enrolled in any courses yet.</p>
                        <a href="courses.html" class="btn btn-primary mt-sm" style="margin-top: 1rem;">Browse Courses</a>
                    </div>
                </div>
            </section>

            <aside class="dashboard-sidebar">
                <section class="certificates-section card" style="margin-bottom: var(--spacing-md); padding: var(--spacing-md);">
                    <h3 class="display-font" style="font-size: 1.2rem;"><i class="fas fa-award text-lib-gold"></i> Certificates</h3>
                    <div id="certificates-container" style="margin-top: 1rem;">
                        <p style="font-size: 0.9rem; color: var(--text-muted);">Complete a course to earn your certificate.</p>
                    </div>
                </section>

                <section class="activity-feed card" style="padding: var(--spacing-md);">
                    <h3 class="display-font" style="font-size: 1.2rem;"><i class="fas fa-history text-lib-blue"></i> Recent Activity</h3>
                    <ul id="activity-list" style="margin-top: 1rem; font-size: 0.9rem; list-style: none;">
                        <li style="margin-bottom: 0.8rem; border-left: 2px solid var(--lib-blue); padding-left: 10px;">Joined GentsAcademy!</li>
                    </ul>
                </section>
            </aside>
        </div>
    </main>

    <style>
        .progress-card {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.5rem;
        }
        .progress-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: conic-gradient(var(--lib-blue) 0%, #eee 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .progress-ring::after {
            content: attr(data-percent) '%';
            position: absolute;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
        }
        @media (max-width: 992px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>

    <script src="js/dashboard.js"></script>
</body>
</html>
